<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      align-items: center;
      height: 5vh;
      background-color: blueviolet;
    }

    .center-block {
      width: 100%;
      margin-left: 10%;
      display: flex;
      justify-content: center;
    }

    .nav-bar {
      display: flex;
      margin-right: 10%;
      justify-content: center;
      min-width: 90%;
    }

    .logo-container {
      align-self: flex-start;
    }
  </style>
  <body>
    <div class="container">
      <div class="center-block">
        <div class="logo-container">logo</div>
        <div class="nav-bar">
          <div class="nav">Home</div>
          <div class="nav">About</div>
          <div class="nav">Service</div>
          <div class="nav">Work</div>
          <div class="nav">Contact</div>
        </div>
      </div>
    </div>
  </body>
</html>
